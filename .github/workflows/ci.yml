name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: Quality, tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fastapi_user
          POSTGRES_PASSWORD: fastapi_password
          POSTGRES_DB: fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastapi_user -d fastapi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://fastapi_user:fastapi_password@localhost:5432/fastapi_test
      BENCHMARK_DATABASE_URL: postgresql+psycopg://fastapi_user:fastapi_password@localhost:5432/fastapi_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      JWT_AUDIENCE: fastapi-client
      JWT_ISSUER: jobtrack-api
      REDIS_TEST_URL: redis://localhost:6379/15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate and verify frontend API contract
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts

      - name: Check frontend quality
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:run
          npm run build

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --cov-report=xml

      - name: Start API for browser tests
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/jobtrack-e2e-api.log 2>&1 &
          echo $! >/tmp/jobtrack-e2e-api.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jobtrack-e2e-api.log
          exit 1

      - name: Install Playwright browser
        working-directory: frontend
        run: npm run test:e2e:install

      - name: Run browser end-to-end test
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Show browser-test API logs
        if: failure()
        run: cat /tmp/jobtrack-e2e-api.log

      - name: Stop browser-test API
        if: always()
        run: |
          if test -f /tmp/jobtrack-e2e-api.pid; then
            kill "$(cat /tmp/jobtrack-e2e-api.pid)" 2>/dev/null || true
          fi

      - name: Run database benchmark smoke test
        run: |
          uv run python -m benchmarks.db prepare --records 25
          uv run python -m benchmarks.db run \
            --mode both \
            --scenarios authenticated_read refresh_rotation \
            --iterations 8 \
            --warmup 2 \
            --concurrency 2 \
            --pool-size 2 \
            --output benchmark-smoke.json
          uv run python -m benchmarks.db verify-async-rollback

      - name: Clean up database benchmark fixtures
        if: always()
        run: uv run python -m benchmarks.db cleanup

      - name: Upload database benchmark smoke result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-benchmark-smoke
          path: benchmark-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Build distributions
        run: uv build

      - name: Smoke-test wheel
        run: >-
          uv run --isolated --no-project --with dist/*.whl python -c
          "import tomllib; from app.main import app;
          expected = tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
          assert app.version == expected, (app.version, expected)"

      - name: Build production container image
        run: docker build --tag jobtrack-api:ci .

      - name: Build frontend container image
        run: docker build --tag jobtrack-frontend:ci frontend

      - name: Verify frontend container identity and dependencies
        run: |
          test "$(docker run --rm --entrypoint id jobtrack-frontend:ci -u)" != "0"
          docker run --rm --entrypoint sh jobtrack-frontend:ci -c "! command -v node"

      - name: Smoke-test frontend container and SPA fallback
        run: |
          docker run --detach \
            --name jobtrack-frontend-ci \
            --add-host api:127.0.0.1 \
            --publish 3000:8080 \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/cache/nginx \
            --tmpfs /var/run \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            jobtrack-frontend:ci

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ \
              | grep --quiet "JobTrack"; then
              curl --fail --silent http://127.0.0.1:3000/settings/security \
                | grep --quiet "JobTrack"
              curl --fail --silent --head http://127.0.0.1:3000/ \
                | grep --ignore-case --quiet "content-security-policy"
              exit 0
            fi
            sleep 1
          done
          docker logs jobtrack-frontend-ci
          exit 1

      - name: Remove frontend container
        if: always()
        run: docker rm --force jobtrack-frontend-ci 2>/dev/null || true

      - name: Verify production container identity and dependencies
        run: |
          test "$(docker run --rm --entrypoint id jobtrack-api:ci -u)" = "10001"
          docker run --rm --entrypoint python jobtrack-api:ci -c \
            "import importlib.util; assert importlib.util.find_spec('pytest') is None"

      - name: Smoke-test production container
        run: |
          docker run --detach \
            --name jobtrack-api-ci \
            --network host \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env DATABASE_URL="$DATABASE_URL" \
            --env SECRET_KEY="$SECRET_KEY" \
            jobtrack-api:ci

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live \
              && curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Show production container logs
        if: failure()
        run: docker logs jobtrack-api-ci 2>/dev/null || true

      - name: Remove production container
        if: always()
        run: docker rm --force jobtrack-api-ci 2>/dev/null || true
